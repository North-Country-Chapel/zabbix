        - uuid: b1c2d3e4f5a67890123456789012b008
          expression: 'last(/Website Monitoring/web.test.rspcode[{$WEB.SITE2.NAME} availability,GET {$WEB.SITE2.NAME}])<>{$WEB.EXPECTED_CODE} and last(/Website Monitoring/web.test.rspcode[{$WEB.SITE2.NAME} availability,GET {$WEB.SITE2.NAME}])>0'
