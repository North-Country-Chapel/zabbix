              parameters:
                - '$.result.value'

      httptests:
        - uuid: a1b2c3d4e5f6789012345678901234a1
          name: '{$WEB.SITE1.NAME} availability'
          delay: 1m
          agent: 'Zabbix/{$WEB.SITE1.NAME}'
          retries: 2
          steps:
            - name: 'GET {$WEB.SITE1.NAME}'
              url: '{$WEB.SITE1.URL}'
              timeout: 15s
              follow_redirects: 'YES'
              status_codes: '{$WEB.EXPECTED_CODE}'
              required: '{$WEB.SITE1.MATCH}'

        - uuid: a1b2c3d4e5f6789012345678901234a2
          name: '{$WEB.SITE2.NAME} availability'
          delay: 1m
          agent: 'Zabbix/{$WEB.SITE2.NAME}'
          retries: 2
          steps:
            - name: 'GET {$WEB.SITE2.NAME}'
              url: '{$WEB.SITE2.URL}'
              timeout: 15s
              follow_redirects: 'YES'
              status_codes: '{$WEB.EXPECTED_CODE}'
              required: '{$WEB.SITE2.MATCH}'

        - uuid: a1b2c3d4e5f6789012345678901234a3
          name: '{$WEB.SITE3.NAME} availability'
          delay: 1m
          agent: 'Zabbix/{$WEB.SITE3.NAME}'
          retries: 2
          steps:
            - name: 'GET {$WEB.SITE3.NAME}'
              url: '{$WEB.SITE3.URL}'
              timeout: 15s
              follow_redirects: 'YES'
