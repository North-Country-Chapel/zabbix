        - uuid: a1b2c3d4e5f6789012345678901234a4
          name: '{$WEB.SITE4.NAME} availability'
          delay: 1m
          agent: 'Zabbix/{$WEB.SITE4.NAME}'
          retries: 2
          steps:
            - name: 'GET {$WEB.SITE4.NAME}'
              url: '{$WEB.SITE4.URL}'
              timeout: 15s
              follow_redirects: 'YES'
              status_codes: '{$WEB.EXPECTED_CODE}'
              required: '{$WEB.SITE4.MATCH}'

      triggers:
        # ===== Site 1 =====
        - uuid: b1c2d3e4f5a67890123456789012b001
          expression: 'last(/Website Monitoring/web.test.fail[{$WEB.SITE1.NAME} availability])<>0'
          name: '{$WEB.SITE1.NAME}: Web scenario failed'
          priority: HIGH
          description: '{$WEB.SITE1.URL} failed. Last error: {ITEM.LASTVALUE2}'
          manual_close: 'YES'

        - uuid: b1c2d3e4f5a67890123456789012b002
          expression: 'avg(/Website Monitoring/web.test.time[{$WEB.SITE1.NAME} availability,GET {$WEB.SITE1.NAME},resp],5m)>{$WEB.RESPONSE_TIME.WARN}'
          name: '{$WEB.SITE1.NAME}: Response time is high (>{$WEB.RESPONSE_TIME.WARN}s for 5m)'
          priority: WARNING
          dependencies:
            - name: '{$WEB.SITE1.NAME}: Response time is very high (>{$WEB.RESPONSE_TIME.HIGH}s for 5m)'
              expression: 'avg(/Website Monitoring/web.test.time[{$WEB.SITE1.NAME} availability,GET {$WEB.SITE1.NAME},resp],5m)>{$WEB.RESPONSE_TIME.HIGH}'

        - uuid: b1c2d3e4f5a67890123456789012b003
          expression: 'avg(/Website Monitoring/web.test.time[{$WEB.SITE1.NAME} availability,GET {$WEB.SITE1.NAME},resp],5m)>{$WEB.RESPONSE_TIME.HIGH}'
          name: '{$WEB.SITE1.NAME}: Response time is very high (>{$WEB.RESPONSE_TIME.HIGH}s for 5m)'
          priority: HIGH

        - uuid: b1c2d3e4f5a67890123456789012b004
          expression: 'last(/Website Monitoring/web.test.rspcode[{$WEB.SITE1.NAME} availability,GET {$WEB.SITE1.NAME}])<>{$WEB.EXPECTED_CODE} and last(/Website Monitoring/web.test.rspcode[{$WEB.SITE1.NAME} availability,GET {$WEB.SITE1.NAME}])>0'
          name: '{$WEB.SITE1.NAME}: Unexpected HTTP response code'
          priority: AVERAGE
          description: 'HTTP code is {ITEM.LASTVALUE}, expected {$WEB.EXPECTED_CODE}.'

        - uuid: b1c2d3e4f5a67890123456789012b101
          expression: 'last(/Website Monitoring/web.cert.expiry.days[{$WEB.SITE1.NAME}])<{$WEB.CERT.WARN_DAYS}'
          name: '{$WEB.SITE1.NAME}: SSL cert expires in <{$WEB.CERT.WARN_DAYS}d'
          priority: WARNING
          description: 'Cert expires in {ITEM.LASTVALUE} days.'
          dependencies:
            - name: '{$WEB.SITE1.NAME}: SSL cert expires in <{$WEB.CERT.HIGH_DAYS}d'
              expression: 'last(/Website Monitoring/web.cert.expiry.days[{$WEB.SITE1.NAME}])<{$WEB.CERT.HIGH_DAYS}'

        - uuid: b1c2d3e4f5a67890123456789012b102
          expression: 'last(/Website Monitoring/web.cert.expiry.days[{$WEB.SITE1.NAME}])<{$WEB.CERT.HIGH_DAYS}'
          name: '{$WEB.SITE1.NAME}: SSL cert expires in <{$WEB.CERT.HIGH_DAYS}d'
          priority: HIGH
          description: 'Cert expires in {ITEM.LASTVALUE} days.'

        - uuid: b1c2d3e4f5a67890123456789012b103
          expression: 'last(/Website Monitoring/web.cert.validation[{$WEB.SITE1.NAME}])<>"valid"'
          name: '{$WEB.SITE1.NAME}: SSL cert validation failed'
          priority: HIGH
          description: 'Cert validation result: {ITEM.LASTVALUE}'

