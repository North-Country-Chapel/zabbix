zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates/Web
  templates:
    - uuid: 9f4c8a2d1b6e4f3c8a9d2e5b7c3f1a4d
      template: 'Website Monitoring'
      name: 'Website Monitoring'
      description: |
        Website availability, response time, content matching, and SSL cert monitoring.
        Supports up to 4 sites. To disable a site, disable its web scenario and cert item on the host.
        
        Per-site macros (replace N with 1-4):
        {$WEB.SITEN.NAME}     - Friendly name (used in scenario/item names)
        {$WEB.SITEN.URL}      - Full URL including https://
        {$WEB.SITEN.HOST}     - Hostname only, for cert check (e.g. example.com)
        {$WEB.SITEN.PORT}     - TLS port for cert check (default: 443)
        {$WEB.SITEN.MATCH}    - String/regex that must appear in response body (empty = no check)
        
        Global thresholds:
        {$WEB.RESPONSE_TIME.WARN}  - Response time warn threshold, seconds (default: 3)
        {$WEB.RESPONSE_TIME.HIGH}  - Response time high threshold, seconds (default: 8)
        {$WEB.EXPECTED_CODE}       - Expected HTTP code (default: 200)
        {$WEB.CERT.WARN_DAYS}      - Cert expiry warning days (default: 14)
        {$WEB.CERT.HIGH_DAYS}      - Cert expiry critical days (default: 3)
      groups:
        - name: Templates/Web
      macros:
        - macro: '{$WEB.SITE1.NAME}'
          value: 'Site1'
        - macro: '{$WEB.SITE1.URL}'
          value: 'https://example.com'
        - macro: '{$WEB.SITE1.HOST}'
          value: 'example.com'
        - macro: '{$WEB.SITE1.PORT}'
          value: '443'
        - macro: '{$WEB.SITE1.MATCH}'
          value: ''
          description: 'Required string/regex in response body (empty disables match)'
        - macro: '{$WEB.SITE2.NAME}'
          value: 'Site2'
        - macro: '{$WEB.SITE2.URL}'
          value: 'https://example.org'
        - macro: '{$WEB.SITE2.HOST}'
          value: 'example.org'
        - macro: '{$WEB.SITE2.PORT}'
          value: '443'
        - macro: '{$WEB.SITE2.MATCH}'
          value: ''
        - macro: '{$WEB.SITE3.NAME}'
          value: 'Site3'
        - macro: '{$WEB.SITE3.URL}'
          value: 'https://example.net'
        - macro: '{$WEB.SITE3.HOST}'
          value: 'example.net'
        - macro: '{$WEB.SITE3.PORT}'
          value: '443'
        - macro: '{$WEB.SITE3.MATCH}'
          value: ''
        - macro: '{$WEB.SITE4.NAME}'
          value: 'Site4'
        - macro: '{$WEB.SITE4.URL}'
          value: 'https://example.io'
        - macro: '{$WEB.SITE4.HOST}'
          value: 'example.io'
        - macro: '{$WEB.SITE4.PORT}'
          value: '443'
        - macro: '{$WEB.SITE4.MATCH}'
          value: ''
        - macro: '{$WEB.RESPONSE_TIME.WARN}'
          value: '3'
        - macro: '{$WEB.RESPONSE_TIME.HIGH}'
          value: '8'
        - macro: '{$WEB.EXPECTED_CODE}'
          value: '200'
        - macro: '{$WEB.CERT.WARN_DAYS}'
          value: '14'
        - macro: '{$WEB.CERT.HIGH_DAYS}'
          value: '3'

      items:
        # ===== Site 1 cert =====
        - uuid: c1d2e3f4a5b6789012345678901234c1
          name: '{$WEB.SITE1.NAME}: SSL certificate'
          type: SIMPLE
          key: 'web.certificate.get[{$WEB.SITE1.HOST},{$WEB.SITE1.PORT}]'
          delay: 1h
          history: 7d
          trends: '0'
          value_type: TEXT
          description: 'TLS certificate info as JSON'

        - uuid: c1d2e3f4a5b6789012345678901234c2
          name: '{$WEB.SITE1.NAME}: SSL cert - days until expiry'
          type: DEPENDENT
          key: 'web.cert.expiry.days[{$WEB.SITE1.NAME}]'
          delay: '0'
          history: 90d
          trends: 365d
          value_type: FLOAT
          units: days
          master_item:
            key: 'web.certificate.get[{$WEB.SITE1.HOST},{$WEB.SITE1.PORT}]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.not_after.timestamp'
            - type: JAVASCRIPT
              parameters:
                - 'return (Number(value) - Math.floor(Date.now()/1000)) / 86400;'

        - uuid: c1d2e3f4a5b6789012345678901234c3
          name: '{$WEB.SITE1.NAME}: SSL cert - validation result'
          type: DEPENDENT
          key: 'web.cert.validation[{$WEB.SITE1.NAME}]'
          delay: '0'
          history: 7d
          trends: '0'
          value_type: CHAR
          master_item:
            key: 'web.certificate.get[{$WEB.SITE1.HOST},{$WEB.SITE1.PORT}]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.result.value'

        # ===== Site 2 cert =====
        - uuid: c1d2e3f4a5b6789012345678901234c4
          name: '{$WEB.SITE2.NAME}: SSL certificate'
          type: SIMPLE
          key: 'web.certificate.get[{$WEB.SITE2.HOST},{$WEB.SITE2.PORT}]'
          delay: 1h
          history: 7d
          trends: '0'
          value_type: TEXT

        - uuid: c1d2e3f4a5b6789012345678901234c5
          name: '{$WEB.SITE2.NAME}: SSL cert - days until expiry'
          type: DEPENDENT
          key: 'web.cert.expiry.days[{$WEB.SITE2.NAME}]'
          delay: '0'
          history: 90d
          trends: 365d
          value_type: FLOAT
          units: days
          master_item:
            key: 'web.certificate.get[{$WEB.SITE2.HOST},{$WEB.SITE2.PORT}]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.not_after.timestamp'
            - type: JAVASCRIPT
              parameters:
                - 'return (Number(value) - Math.floor(Date.now()/1000)) / 86400;'

        - uuid: c1d2e3f4a5b6789012345678901234c6
          name: '{$WEB.SITE2.NAME}: SSL cert - validation result'
          type: DEPENDENT
          key: 'web.cert.validation[{$WEB.SITE2.NAME}]'
          delay: '0'
          history: 7d
          trends: '0'
          value_type: CHAR
          master_item:
            key: 'web.certificate.get[{$WEB.SITE2.HOST},{$WEB.SITE2.PORT}]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.result.value'

        # ===== Site 3 cert =====
        - uuid: c1d2e3f4a5b6789012345678901234c7
          name: '{$WEB.SITE3.NAME}: SSL certificate'
          type: SIMPLE
          key: 'web.certificate.get[{$WEB.SITE3.HOST},{$WEB.SITE3.PORT}]'
          delay: 1h
          history: 7d
          trends: '0'
          value_type: TEXT

        - uuid: c1d2e3f4a5b6789012345678901234c8
          name: '{$WEB.SITE3.NAME}: SSL cert - days until expiry'
          type: DEPENDENT
          key: 'web.cert.expiry.days[{$WEB.SITE3.NAME}]'
          delay: '0'
          history: 90d
          trends: 365d
          value_type: FLOAT
          units: days
          master_item:
            key: 'web.certificate.get[{$WEB.SITE3.HOST},{$WEB.SITE3.PORT}]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.not_after.timestamp'
            - type: JAVASCRIPT
              parameters:
                - 'return (Number(value) - Math.floor(Date.now()/1000)) / 86400;'

        - uuid: c1d2e3f4a5b6789012345678901234c9
          name: '{$WEB.SITE3.NAME}: SSL cert - validation result'
          type: DEPENDENT
          key: 'web.cert.validation[{$WEB.SITE3.NAME}]'
          delay: '0'
          history: 7d
          trends: '0'
          value_type: CHAR
          master_item:
            key: 'web.certificate.get[{$WEB.SITE3.HOST},{$WEB.SITE3.PORT}]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.result.value'

        # ===== Site 4 cert =====
        - uuid: c1d2e3f4a5b6789012345678901234ca
          name: '{$WEB.SITE4.NAME}: SSL certificate'
          type: SIMPLE
          key: 'web.certificate.get[{$WEB.SITE4.HOST},{$WEB.SITE4.PORT}]'
          delay: 1h
          history: 7d
          trends: '0'
          value_type: TEXT

        - uuid: c1d2e3f4a5b6789012345678901234cb
          name: '{$WEB.SITE4.NAME}: SSL cert - days until expiry'
          type: DEPENDENT
          key: 'web.cert.expiry.days[{$WEB.SITE4.NAME}]'
          delay: '0'
          history: 90d
          trends: 365d
          value_type: FLOAT
          units: days
          master_item:
            key: 'web.certificate.get[{$WEB.SITE4.HOST},{$WEB.SITE4.PORT}]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.not_after.timestamp'
            - type: JAVASCRIPT
              parameters:
                - 'return (Number(value) - Math.floor(Date.now()/1000)) / 86400;'

        - uuid: c1d2e3f4a5b6789012345678901234cc
          name: '{$WEB.SITE4.NAME}: SSL cert - validation result'
          type: DEPENDENT
          key: 'web.cert.validation[{$WEB.SITE4.NAME}]'
          delay: '0'
          history: 7d
          trends: '0'
          value_type: CHAR
          master_item:
            key: 'web.certificate.get[{$WEB.SITE4.HOST},{$WEB.SITE4.PORT}]'
          preprocessing:
